name: Deploy Blendbarometer – Test (FTP)

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install PHP dependencies ───────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # ── Build front-end assets ─────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # ── Prepare upload (remove dev / CI-only files) ────────────
      - name: Prepare deployment payload
        run: bash scripts/prepare-deploy.sh

      # ── Upload to FTP ──────────────────────────────────────────
      - name: Deploy to test via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.TEST_FTP_SERVER }}
          username: ${{ secrets.TEST_FTP_USER }}
          password: ${{ secrets.TEST_FTP_PASSWORD }}
          protocol: ${{ secrets.TEST_FTP_PROTOCOL }}
          port: ${{ secrets.TEST_FTP_PORT }}
          server-dir: ${{ secrets.TEST_FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            tests/**
            .env
            .env.*
            phpunit.xml
            vite.config.js
